name: P15 user-stop reference validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  p15-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run synthetic P15 reference tests
        run: python -m unittest discover -s p15 -p 'test_*.py' -v
      - name: Validate event schema JSON
        run: python -m json.tool USER-STOP-EVENT-SCHEMA.json > /dev/null
